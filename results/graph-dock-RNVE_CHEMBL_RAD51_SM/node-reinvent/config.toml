run_type = "staged_learning"
device = "cuda"
tb_logdir = "tb_logs"
json_out_config = "_staged_learning.json"
[[stage]]
chkpt_file = "test1.chkpt"
termination = "simple"
min_steps = 300
max_steps = 302

[stage.scoring]
type = "geometric_mean"
parallel = true
[[stage.scoring.component]]

[stage.scoring.component.QED]
[[stage.scoring.component.QED.endpoint]]
name = "QED"
weight = 1

[[stage.scoring.component]]

[stage.scoring.component.ExternalProcess]
[[stage.scoring.component.ExternalProcess.endpoint]]
name = "maize"
weight = 1

[stage.scoring.component.ExternalProcess.endpoint.params]
executable = "./intercept.py"
args = ""
property = "predictions"
[stage.scoring.component.ExternalProcess.endpoint.transform]
low = -10.0
high = -5.0
k = 0.5
type = "reverse_sigmoid"

[parameters]
summary_csv_prefix = "staged_learning"
use_checkpoint = true
purge_memories = false
batch_size = 4
unique_sequences = true
randomize_smiles = true
tb_isim = true
prior_file = "/home/a/REINVENT4/ReinventStudies/priors/reinvent.prior"
agent_file = "/home/a/REINVENT4/ReinventStudies/priors/reinvent.prior"

[learning_strategy]
type = "dap"
sigma = 128
rate = 0.005

[inception]
smiles_file = "mols/ChemBL_Rad51_SM.smi"
memory_size = 100
sample_size = 10
