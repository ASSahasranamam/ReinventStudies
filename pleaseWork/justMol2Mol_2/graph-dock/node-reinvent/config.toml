run_type = "staged_learning"
device = "cuda"
tb_logdir = "tb_logs"
json_out_config = "justMol2Mol_2_staged_learning.json"
[[stage]]
chkpt_file = "justMol2Mol_2_staged_learning_1.chkpt"
termination = "simple"
min_steps = 100
max_steps = 102

[stage.scoring]
type = "geometric_mean"
[[stage.scoring.component]]

[stage.scoring.component.custom_alerts]
[[stage.scoring.component.custom_alerts.endpoint]]
name = "Unwanted SMARTS"

[stage.scoring.component.custom_alerts.endpoint.params]
smarts = [ "[*;r8]", "[*;r9]", "[*;r10]", "[*;r11]", "[*;r12]", "[*;r13]", "[*;r14]", "[*;r15]", "[*;r16]", "[*;r17]", "[#8][#8]", "[#6;+]", "[#16][#16]", "[#7;!n][S;!$(S(=O)=O)]", "[#7;!n][#7;!n]", "C#C", "C(=[O,S])[O,S]", "[#7;!n][C;!$(C(=[O,N])[N,O])][#16;!s]", "[#7;!n][C;!$(C(=[O,N])[N,O])][#7;!n]", "[#7;!n][C;!$(C(=[O,N])[N,O])][#8;!o]", "[#8;!o][C;!$(C(=[O,N])[N,O])][#16;!s]", "[#8;!o][C;!$(C(=[O,N])[N,O])][#8;!o]", "[#16;!s][C;!$(C(=[O,N])[N,O])][#16;!s]",]
[[stage.scoring.component]]

[stage.scoring.component.QED]
[[stage.scoring.component.QED.endpoint]]
name = "QED"
weight = 0.25

[[stage.scoring.component]]

[stage.scoring.component.TanimotoDistance]
[[stage.scoring.component.TanimotoDistance.endpoint]]
name = "TanimotoDistance"
weight = 0.25

[stage.scoring.component.TanimotoDistance.endpoint.params]
smiles = [ "C[C@@H](c1c(cc(cc1)OC)Cl)NC(=O)[C@@H]1C[C@H](CN1C(=O)CNC(=O)c1nc2c(cc1)cc(cc2)F)O",]
radius = 3
use_counts = true
use_features = true
[[stage.scoring.component]]

[stage.scoring.component.ExternalProcess]
[[stage.scoring.component.ExternalProcess.endpoint]]
name = "maize"
weight = 0.5

[stage.scoring.component.ExternalProcess.endpoint.params]
executable = "./intercept.py"
args = ""
property = "predictions"
[stage.scoring.component.ExternalProcess.endpoint.transform]
low = -12.0
high = -3.0
k = 0.2
type = "reverse_sigmoid"

[parameters]
summary_csv_prefix = "justMol2Mol_2"
use_checkpoint = true
purge_memories = false
batch_size = 10
unique_sequences = true
randomize_smiles = true
tb_isim = true
prior_file = "/home/a/REINVENT4/ReinventStudies/priors/mol2mol_similarity.prior"
agent_file = "/home/a/REINVENT4/ReinventStudies/priors/mol2mol_similarity.prior"
smiles_file = "/home/a/REINVENT4/ReinventStudies/mols/Rad51/cam833.smi"
sample_strategy = "multinomial"
distance_threshold = 100

[learning_strategy]
type = "dap"
sigma = 128
rate = 0.0001
